name = "ctx_offload"
description = "Ablation E2: offload large outputs to files (same budget settings as the other ctx_* configs)."
model = "local"
temperature = 0.7
max_output_tokens = 2048
context_strategy = "offload"
context_budget_tokens = 12000
compact_trigger = 0.75
keep_recent_steps = 4
policy = "rule_of_two"
approval = "auto_deny"
sandbox = "auto"
offload_when_over = 0.0   # fixed-threshold offloading, as in the recorded runs
free_plan_steps = 0       # plan-only turns are charged, as in the recorded runs
